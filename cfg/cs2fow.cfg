// CS2FOW server configuration.
// Run "cs2fow_reload" after editing. The old known-good configuration stays
// active unless every line executes and the final internal marker is reached.

// Valve compatibility mode. Both 0 and 1 are supported; 0 is the safe default.
sv_enable_donttransmit 0

// Master protection switch.
cs2fow_enable 1

// Let live CS2 smoke block visibility.
cs2fow_smoke_occlusion 1

// An HE opens this wide a channel through smoke that already existed.
// Set both HE values to 0 to disable HE smoke clearing.
cs2fow_he_clear_radius_units 100
cs2fow_he_clear_seconds 2.5

// Apply the same protection to teammates. FFA is detected automatically.
cs2fow_filter_teammates 0

// Minimum delay between copied player snapshots.
cs2fow_update_interval_ms 1

// Background visibility threads (1-4). A changed value starts on the next map.
cs2fow_worker_threads 2

// Ping-scaled sideways viewing-origin distances.
cs2fow_shoulder_base_units 48
cs2fow_shoulder_rtt_scale 0.4
cs2fow_max_shoulder_units 128

// Keep a newly visible player revealed for about 0.2 seconds to suppress flicker.
cs2fow_visibility_hold_ms 200

// Record actual entity-bit removals for cs2fow_entity. No console spam.
cs2fow_debug 0

// Temporary in-game LOS drawing for a 1-based player slot; 0 disables it.
cs2fow_debug_los_player 0

// Internal transaction marker. This must remain the final command in this file.
cs2fow_config_loaded
